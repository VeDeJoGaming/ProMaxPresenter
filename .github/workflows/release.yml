name: Build Windows release
run-name: ProMax Presenter release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version, without v'
        required: true
        default: '1.4.0'
      require_signing:
        description: 'Require the configured Windows signing certificate'
        type: boolean
        default: false
concurrency:
  group: promax-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate the version and skip existing releases
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseVersion = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $packageVersion }
          if ($releaseVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Use a stable semantic version.' }
          if ($releaseVersion -ne $packageVersion) { throw 'Update package.json and its lockfile first.' }
          $tags = gh api --paginate "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify existing versions.' }
          $versions = @($tags | Where-Object { $_ -match '^refs/tags/v\d+\.\d+\.\d+$' } | ForEach-Object { [version]($_ -replace '^refs/tags/v','') })
          if ($versions.Count -gt 0 -and [version]$releaseVersion -le ($versions | Sort-Object -Descending | Select-Object -First 1)) {
            'build=false' >> $env:GITHUB_OUTPUT
          } else {
            'build=true' >> $env:GITHUB_OUTPUT
            "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
          }
      - if: steps.version.outputs.build == 'true'
        run: npm ci --no-fund
      - if: steps.version.outputs.build == 'true'
        run: npm test
      - if: steps.version.outputs.build == 'true'
        run: npm run test:desktop
        timeout-minutes: 3
      - if: steps.version.outputs.build == 'true'
        run: npm run test:visuals
        timeout-minutes: 3
      - if: steps.version.outputs.build == 'true'
        run: npm run test:shared
        timeout-minutes: 3
      - if: steps.version.outputs.build == 'true'
        run: npm run test:backup
        timeout-minutes: 3
      - name: Check recent operator, meeting and Stellar improvements
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: |
          foreach ($script in @('test/operator-tools-desktop.cjs','test/meeting-check-desktop.cjs','test/meeting-plan-desktop.cjs','test/quick-open-media-desktop.cjs','test/presentation-keys-desktop.cjs','test/preparation-keys-desktop.cjs','test/file-pickers-desktop.cjs','test/youtube-library-desktop.cjs','test/video-transport-desktop.cjs','test/video-import-desktop.cjs','test/meeting-live-desktop.cjs','test/recovery-desktop.cjs','test/stellar-visual.cjs')) {
            node $script
            if ($LASTEXITCODE -ne 0) { throw "Feature verification failed: $script" }
          }
      - name: Build the installer with all backgrounds included
        if: steps.version.outputs.build == 'true'
        run: npm run dist:release
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          PROMAX_REQUIRE_SIGNING: ${{ inputs.require_signing }}
      - name: Check the packaged application
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: |
          node test/recovered-desktop.cjs "dist/win-unpacked/ProMax Presenter.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged app verification failed.' }
          node test/visual-library-desktop.cjs "dist/win-unpacked/ProMax Presenter.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged visual library verification failed.' }
      - name: Check recent features in the packaged application
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: |
          foreach ($script in @('test/operator-tools-desktop.cjs','test/meeting-check-desktop.cjs','test/meeting-plan-desktop.cjs','test/quick-open-media-desktop.cjs','test/presentation-keys-desktop.cjs','test/preparation-keys-desktop.cjs','test/file-pickers-desktop.cjs','test/youtube-library-desktop.cjs','test/video-transport-desktop.cjs','test/video-import-desktop.cjs','test/meeting-live-desktop.cjs','test/recovery-desktop.cjs','test/stellar-visual.cjs')) {
            node $script "dist/win-unpacked/ProMax Presenter.exe"
            if ($LASTEXITCODE -ne 0) { throw "Packaged feature verification failed: $script" }
          }
      - name: Create checksums
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe,dist/*.blockmap,dist/latest.yml | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.build == 'true'
        with:
          name: ProMax-Presenter-${{ env.RELEASE_VERSION }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
      - name: Create the release
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/*.exe,dist/*.blockmap,dist/latest.yml,dist/SHA256SUMS.txt | ForEach-Object { $_.FullName })
          gh release create "v$env:RELEASE_VERSION" @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "ProMax Presenter $env:RELEASE_VERSION" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release.' }
      - name: Publish verified updates from main
        if: steps.version.outputs.build == 'true' && github.event_name == 'push'
        shell: pwsh
        run: |
          gh release edit "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
