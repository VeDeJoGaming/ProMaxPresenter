name: Check app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
        timeout-minutes: 3
      - run: npm run test:text
        timeout-minutes: 3
      - run: npm run test:private
        timeout-minutes: 3
      - run: npm run test:desktop
        timeout-minutes: 3
      - run: node test/meeting-plan-desktop.cjs
        timeout-minutes: 3
      - run: node test/quick-open-media-desktop.cjs
        timeout-minutes: 3
      - run: node test/presentation-keys-desktop.cjs
        timeout-minutes: 3
      - run: node test/video-transport-desktop.cjs
        timeout-minutes: 3
      - run: node test/video-import-desktop.cjs
        timeout-minutes: 3
      - run: node test/meeting-live-desktop.cjs
        timeout-minutes: 3
      - run: node test/recovery-desktop.cjs
        timeout-minutes: 3
      - run: npm run test:visuals
        timeout-minutes: 3
      - run: npm run test:shared
        timeout-minutes: 3
