<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Etterklang — ProMax Visuals</title><desc>Original animated presentation background. Slow looping motion. No external assets or scripts.</desc><defs><radialGradient id="copper"><stop stop-color="#9a573c" stop-opacity=".8"/><stop offset=".45" stop-color="#9a573c" stop-opacity=".25"/><stop offset="1" stop-color="#9a573c" stop-opacity="0"/></radialGradient><radialGradient id="plum"><stop stop-color="#5c346a" stop-opacity=".8"/><stop offset=".45" stop-color="#5c346a" stop-opacity=".25"/><stop offset="1" stop-color="#5c346a" stop-opacity="0"/></radialGradient><linearGradient id="ring"><stop stop-color="#e5b68b" stop-opacity="0"/><stop offset=".46" stop-color="#e5b68b" stop-opacity=".28"/><stop offset="1" stop-color="#b183ad" stop-opacity=".03"/></linearGradient><radialGradient id="edge"><stop offset=".2" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient></defs><rect width="1920" height="1080" fill="#130f18"/><g><ellipse cx="1730" cy="1100" rx="1100" ry="1000" fill="url(#copper)"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;-100 -80;0 0" dur="32s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/></g><g><ellipse cx="-200" cy="0" rx="1400" ry="1050" fill="url(#plum)"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;80 110;0 0" dur="36s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/></g><g transform="translate(1450 890)"><ellipse rx="280" ry="220" fill="none" stroke="url(#ring)" stroke-width="4" transform="rotate(0)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="180s" repeatCount="indefinite"/></ellipse><ellipse rx="375" ry="296" fill="none" stroke="url(#ring)" stroke-width="5.5" transform="rotate(11)"><a