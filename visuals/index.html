<!doctype html><html lang="nb"><meta charset="utf-8"><title>ProMax visuals</title><style>/* Shared ProMax UI palette: desktop, group pages and visual gallery. */
:root {
  --pm-font: Inter, "Segoe UI", Arial, sans-serif;
  --pm-bg: #151111;
  --pm-header: #1c1616;
  --pm-panel: #1e1818;
  --pm-card: #241c1b;
  --pm-field: #191313;
  --pm-button: #302522;
  --pm-button-hover: #44302a;
  --pm-border: #4b3430;
  --pm-border-soft: #372825;
  --pm-border-hover: #98614d;
  --pm-text: #f4e9e5;
  --pm-muted: #b7a39c;
  --pm-accent: #ff8a3d;
  --pm-accent-hover: #ffab69;
  --pm-on-accent: #241108;
  --pm-red: #ef5349;
  --pm-selection-bg: #37221b;
  --pm-selection-border: #7b4230;
  --pm-selection-text: #ffb37e;
  --pm-notice-bg: #ffd5b8;
  --pm-radius: 7px;
  --pm-radius-panel: 10px;
  accent-color: var(--pm-accent);
}
:where(button, a, input, select, textarea):focus-visible {
  outline: 2px solid var(--pm-accent);
  outline-offset: 3px;
}

body{background:var(--bg,#171211);color:#eee;font:16px system-ui;margin:32px}header{max-width:850px}h1{color:#ff7137}select,button,input{background:#302421;color:#eee;border:1px solid #634339;border-radius:8px;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;margin-top:30px}.stage{aspect-ratio:16/9;position:relative;overflow:hidden;background:#0b0d16;border-radius:12px}.media{position:absolute;inset:0;width:100%;height:100%}.lyrics{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:white;text-shadow:0 2px 4px black;font-size:22px;pointer-events:none}.caption{display:flex;justify-content:space-between;margin-top:10px}</style>
<header><h1>ProMax · Motion backgrounds</h1><p>Én oppføring per visual. Farger, uttrykk og bevegelse justeres i appen. Hold pekeren over for bevegelse.</p><label>Farger <select id="palette"><option value="original">Original</option><option value="gold">Gold</option><option value="blue">Blue</option><option value="purple">Purple</option><option value="rose">Rose</option><option value="green">Green</option><option value="white">Silver</option></select></label> <label>Uttrykk <select id="look"><option value="a">A · Calm</option><option value="b">B · Full</option><option value="c">C · Intense</option></select></label></header><main class="grid"></main>
<script src="../visual-engine.js"></script><script src="../visual-scenes.js"></script><script src="../bundled-visuals.js"></script><script src="../visuals.js"></script><script>
let surfaces=[];function build(){surfaces.forEach(s=>s?.stop());surfaces=[];document.querySelector('main').replaceChildren();for(const p of ProMaxVisuals.presets){const card=document.createElement('article'),stage=document.createElement('div');stage.className='stage';card.append(stage);const opts={visualPalette:palette.value,glassAuto:false,glassVariant:look.value};let canvas=ProMaxVisuals.mount(stage,p.id,false,opts);const label=document.createElement('div');label.className='lyrics';label.innerText='La ordene få rom\nog øyeblikket vare';stage.append(label);const caption=document.createElement('div');caption.className='caption';caption.textContent=p.name+' · '+p.category;card.append(caption);document.querySelector('main').append(card);surfaces.push(canvas);card.onmouseenter=()=>{canvas?.stop();canvas?.remove();canvas=ProMaxVisuals.mount(stage,p.id,true,opts);surfaces.push(canvas)};card.onmouseleave=()=>{canvas?.stop();canvas?.remove();canvas=ProMaxVisuals.mount(stage,p.id,false,opts);surfaces.push(canvas)}}}palette.onchange=look.onchange=build;build();</script></html>
